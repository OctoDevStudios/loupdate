[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loupdate"
version = "0.1.0"
description = "Publish Android OTA updates for Loupdate (S3 / Backblaze B2)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["boto3>=1.34"]

[project.scripts]
loupdate = "loupdate_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["loupdate_cli*"]
