name: loupdate
description: In-app forced/soft updates for Android apps outside Play Store (S3 / Backblaze B2).
version: 0.1.0
homepage: https://github.com/example/loupdate

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.loupdate.flutter
        pluginClass: LoupdatePlugin
